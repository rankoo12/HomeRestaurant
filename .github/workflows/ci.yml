name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: typecheck + lint (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.workspace }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.workspace }}/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

  backend-tests:
    name: backend tests (unit + integration)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hr
          POSTGRES_PASSWORD: hr
          POSTGRES_DB: home_restaurant_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hr -d home_restaurant_test"
          --health-interval 5s --health-timeout 5s --health-retries 5
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgres://hr:hr@localhost:5432/home_restaurant_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - run: npm test

      - run: npm run test:integration
